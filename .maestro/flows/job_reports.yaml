appId: com.ostati.app
---
# Job Reports (#81/#84) — the general moderation "პრობლემის შეტყობინება"
# sheet, shared between Customer's and Provider's Job Detail "..." menus.
# Deliberately separate from the completion-dispute flow ("პრობლემა
# მაქვს") — this one never touches job status, just writes to
# `job_reports` via `create_job_report()`. Covers both role entry points
# and both the fixed-reason and "other + required free text" paths.

- launchApp
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run,
# not just after `pm clear`/reinstall). It does NOT auto-dismiss; it must
# be tapped, or it sits there blocking everything underneath forever.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands
# on the dev-client's floating gear bubble instead (confirmed reproducible
# even on a factory-wiped emulator + fresh install — a raw `adb shell
# input tap` at the same coordinates never has this problem, only
# Maestro's own gesture-dispatch tap does), opening the Tools menu instead
# of dismissing the tip. Detect and back out of it if it happened.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 25000

- tapOn:
    text: ".*პროფილი.*"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

# --- Phase 1: Customer registers, posts a job -------------------------
- evalScript: ${output.customerEmail = 'e2e.report.customer.' + Date.now() + '@example.com'}
- evalScript: ${output.providerEmail = 'e2e.report.provider.' + Date.now() + '@example.com'}
- evalScript: ${output.jobMarker = 'ReportJobE2E' + Date.now()}

- tapOn: ".*დაწყება.*"
- tapOn: ".*მომხმარებელი.*"
- tapOn:
    id: "register-first-name"
- inputText: "ReportCustomer"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.customerEmail}"
- tapOn: ".*ჭავჭავაძის.*"
- inputText: "Test address 1"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*პროფილის დასრულება.*"
- tapOn: "^დასრულება$"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
# `tapOn: id: "post-job-fab"` resolves to this button's CENTER, which sits
# almost fully under the dev-client's persistent floating gear bubble —
# confirmed deterministic, retrying the same center-tap never helps.
# Tapping the fab's top edge (just above the bubble's bounds) reliably
# lands on the real button instead.
- tapOn:
    point: "91%, 7%"
- tapOn: ".*აირჩიე კატეგორია.*"
- tapOn: ".*სანტექნიკა.*"
- tapOn:
    id: "post-job-description"
- inputText: "${output.jobMarker} - bathroom faucet leaking, needs a plumber this week"
- hideKeyboard
- tapOn: "^გამოქვეყნება$"
- assertVisible: ".*მოთხოვნა გამოქვეყნებულია.*"
- tapOn: ".*მთავარზე დაბრუნება.*"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 2: Provider registers, expresses interest -------------------
- tapOn: ".*დაწყება.*"
- tapOn: ".*ოსტატი.*"
- tapOn:
    id: "register-first-name"
- inputText: "ReportProvider"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*შექმენი ოსტატის პროფილი.*"
- tapOn: ".*აირჩიე სპეციალობა.*"
- tapOn: ".*სანტექნიკოსი.*"
- tapOn: "^არჩევა$"
- tapOn: ".*აირჩიე არეალი.*"
- assertVisible: ".*სამუშაო არეალი.*"
- tapOn: ".*ყველას მონიშვნა.*"
- tapOn: "^შენახვა$"
- tapOn: "^პროფილის შექმნა$"
- assertVisible: ".*ახალი მოთხოვნები.*"
- extendedWaitUntil:
    visible: ".*${output.jobMarker}.*"
    timeout: 15000

- tapOn:
    text: ".*დაინტ. ვარ.*"
    below: ".*${output.jobMarker}.*"
- tapOn: ".*ჩაწერეთ თანხა.*"
- inputText: "100"
- hideKeyboard
- tapOn:
    id: "offer-price-submit"
# Product change: interest confirmation now shows on ProviderJobDetailScreen's
# footer button ("შეთავაზდა: <price> ₾"), not the feed card's "sent" strip —
# see provider_core_journey.yaml for the full explanation. `back` pops the
# root-stack detail screen so the tab bar is reachable again.
- assertVisible: ".*შეთავაზდა:.*"
- back

- tapOn: ".*პროფილი.*"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 3: Customer logs back in, selects the Provider (job active) -
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- extendedWaitUntil:
    visible: ".*${output.jobMarker}.*"
    timeout: 15000
- tapOn:
    text: ".*${output.jobMarker}.*"
- assertVisible: ".*დაინტერესებული.*"
- tapOn: "^არჩევა$"
- assertVisible: ".*ოსტატის არჩევა.*"
- tapOn: "^დადასტურება$"

# --- Phase 4: Customer submits a moderation report on this job ---------
# Same fab/bubble collision as "post-job-fab" — this icon-only "..."
# button sits in the same top-right corner. Tap its top edge instead.
- tapOn:
    point: "92%, 7%"
- tapOn: ".*პრობლემის შეტყობინება.*"
- assertVisible: ".*ეს რეპორტი მოდერაციას გადაეცემა.*"
- tapOn: ".*ოსტატი არ გამოცხადდა.*"
- tapOn: "^რეპორტის გაგზავნა$"
- assertVisible: ".*რეპორტი მიღებულია.*"
- tapOn: "^დახურვა$"

- back
- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 5: Provider logs back in, submits its own report ("other") --
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*ახალი მოთხოვნები.*"

- tapOn: ".*სამუშაოები.*"
- tapOn: "^დადასტურებული$"
- extendedWaitUntil:
    visible: ".*ReportCustomer.*"
    timeout: 15000
- tapOn: ".*ReportCustomer.*"

# Same fab/bubble collision as "post-job-fab" — this icon-only "..."
# button sits in the same top-right corner. Tap its top edge instead.
- tapOn:
    point: "92%, 7%"
- tapOn: ".*პრობლემის შეტყობინება.*"
- assertVisible: ".*ეს რეპორტი მოდერაციას გადაეცემა.*"
- tapOn: "^სხვა$"
- tapOn: ".*დაწერე დეტალები.*"
- inputText: "E2E test report details"
- hideKeyboard
- tapOn: "^რეპორტის გაგზავნა$"
- assertVisible: ".*რეპორტი მიღებულია.*"
- tapOn: "^დახურვა$"

- back
- tapOn: ".*პროფილი.*"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"
