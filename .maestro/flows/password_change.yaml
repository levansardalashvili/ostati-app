appId: com.ostati.app
---
# Password change (ProfileSettingsScreen → authService.updatePassword) —
# covers both the positive path (change succeeds, new password logs in)
# and the negative path (old password no longer works afterward).

- launchApp
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run,
# not just after `pm clear`/reinstall). It does NOT auto-dismiss; it must
# be tapped, or it sits there blocking everything underneath forever.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands
# on the dev-client's floating gear bubble instead (confirmed reproducible
# even on a factory-wiped emulator + fresh install — a raw `adb shell
# input tap` at the same coordinates never has this problem, only
# Maestro's own gesture-dispatch tap does), opening the Tools menu instead
# of dismissing the tip. Detect and back out of it if it happened.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 25000

- tapOn:
    text: ".*პროფილი.*"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

# --- Customer registers -------------------------------------------------
- evalScript: ${output.customerEmail = 'e2e.password.customer.' + Date.now() + '@example.com'}

- tapOn: ".*დაწყება.*"
- tapOn: ".*მომხმარებელი.*"
- tapOn:
    id: "register-first-name"
- inputText: "PasswordCustomer"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.customerEmail}"
- tapOn: ".*ჭავჭავაძის.*"
- inputText: "Test address 1"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*პროფილის დასრულება.*"
- tapOn: "^დასრულება$"
- assertVisible: ".*სერვისები.*"

# --- Change the password -------------------------------------------------
- tapOn: ".*პროფილი.*"
- tapOn: ".*ანგარიშის პარამეტრები.*"
- assertVisible: ".*პაროლის შეცვლა.*"
- tapOn: ".*პაროლის შეცვლა.*"
- assertVisible: ".*მიმდინარე პაროლი.*"

- tapOn:
    id: "settings-old-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "settings-new-password"
- inputText: "NewTestPass456"
- hideKeyboard
- tapOn: "^შენახვა$"
- assertVisible: ".*პაროლი შეიცვალა.*"
- tapOn: "OK"

- back
- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- New password logs in successfully -----------------------------------
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "NewTestPass456"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Old password no longer works ----------------------------------------
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*ელ. ფოსტა ან პაროლი არასწორია.*"
