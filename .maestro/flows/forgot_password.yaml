appId: com.ostati.app
---
# ForgotPasswordScreen (A3) — never covered by any existing flow (all of
# them log in with a freshly-registered account instead). No account
# registration needed here — the interesting behavior is entirely
# client-side validation plus one Supabase Auth call.
#
# The most important thing this proves: `authService.sendPasswordReset`'s
# deliberate security behavior — a non-existent email shows the exact same
# "ბმული გამოგზავნილია" success state as a real one (`auth/user-not-found`
# is swallowed into `setSent(true)`, per the screen's own comment) — so an
# attacker can't use this form to enumerate which emails have accounts.

- launchApp
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run).
# It does NOT auto-dismiss; it must be tapped, or it sits there blocking
# everything underneath forever.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands on
# the dev-client's floating gear bubble instead — detect and back out of
# the Tools menu if it happened (see .maestro/README.md for the full
# root-cause writeup).
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 25000

# Leftover-session cleanup, in case a previous run crashed mid-flow.
- tapOn:
    text: ".*პროფილი.*"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

- evalScript: ${output.email = 'e2e.forgotpw.' + Date.now() + '@example.com'}

- tapOn: ".*შესვლა.*"
- tapOn: ".*დაგავიწყდა პაროლი?.*"
- assertVisible: ".*პაროლის აღდგენა.*"

# --- Validation: an invalid email format shows an error and the submit
# button stays disabled (never even attempts a network call). -----------
- tapOn: "example@email.com"
- inputText: "notanemail"
- hideKeyboard
# The screen's own error text only renders on blur (`touched` state),
# and neither `hideKeyboard` nor tapping a plain, non-focusable Text
# elsewhere reliably fires RN's `onBlur` here — so assert the button's
# real `disabled` state instead (Button.tsx's `disabled` prop maps to
# Pressable's own `disabled`, which Android exposes as `enabled: false`
# in the accessibility tree). This is the behavior that actually matters:
# the user physically cannot submit an invalid email.
- assertVisible:
    text: ".*აღდგენის ბმულის გაგზავნა.*"
    enabled: false

# --- Submit with a well-formed but non-existent email — must still show
# the success state (security: never reveal whether an account exists). -
- eraseText
- inputText: "${output.email}"
- hideKeyboard
- tapOn: ".*აღდგენის ბმულის გაგზავნა.*"
- assertVisible: ".*ბმული გამოგზავნილია.*"
- assertVisible: ".*${output.email}.*"

- tapOn: ".*შესვლაზე დაბრუნება.*"
- assertVisible: ".*დაგავიწყდა პაროლი?.*"
