appId: com.ostato.app
---
# ForgotPasswordScreen (A3) + PhoneForgotPasswordScreen — the 3-step OTP
# recovery wizard (#170, replacing the old dead-end magic-link email flow).
#
# Email path: registers a throwaway Provider account first (minimal setup —
# specialty + "select all areas", no photo/about needed) specifically to
# have a REAL, registered account to submit forgot-password against.
# Supabase's `signInWithOtp` validates the email domain and rejects it
# outright (`email_address_invalid`) if it doesn't look deliverable —
# confirmed live: `@example.com`/`@e2e.example.com` (every other e2e
# fixture in this project) always fails this way regardless of
# shouldCreateUser/account existence, and even a made-up-but-plausible
# domain (no real DNS record) failed unpredictably. Only a real,
# DNS-resolvable domain works reliably — `@gmail.com` with a random local
# part (astronomically unlikely to collide with a real inbox, and nothing
# gets delivered anywhere since the account never completes a real login)
# is what both `staleEmail`/`realEmail` use below. The flow deliberately
# STOPS at step 2 (OTP entry) — there is no way for Maestro to read the
# actual emailed code.
#
# What this proves: `sendEmailOtp`/`sendPhoneOtpForReset`'s `shouldCreateUser:
# false` security fix — a non-existent email/phone must error (never
# silently create a blank auth account, never navigate to step 2) while a
# real, registered email correctly advances to step 2.
#
# Phone step 1 is covered for format validation only — actually submitting
# is skipped (SMS provider is currently paused per project memory, so live
# behavior there is external and not something this test should depend on).
#
# Cleanup: the registered throwaway account (`${output.realEmail}`) is not
# auto-deleted — sweep it afterwards the same way other e2e fixtures are
# (`DELETE FROM auth.users WHERE email LIKE 'e2e.forgotpw.%'`).

- launchApp:
    stopApp: false
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run).
# It does NOT auto-dismiss; it must be tapped, or it sits there blocking
# everything underneath forever.
- extendedWaitUntil:
    visible: "DEVELOPMENT SERVERS|Continue|.*დაწყება.*|.*პროფილი.*"
    timeout: 30000
    optional: true
- tapOn:
    point: "37%,28%"
    optional: true
- extendedWaitUntil:
    visible: "Loading from|Continue|.*დაწყება.*|.*პროფილი.*"
    timeout: 90000
    optional: true
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands on
# the dev-client's floating gear bubble instead — detect and back out of
# the Tools menu if it happened (see .maestro/README.md for the full
# root-cause writeup).
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება|შესვლა).*"
    timeout: 90000

# Leftover-session cleanup, in case a previous run crashed mid-flow.
- tapOn:
    text: "^პროფილი$"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

- evalScript: ${output.staleEmail = 'e2e.forgotpw.nouser.' + Date.now() + '@gmail.com'}
- evalScript: ${output.realEmail = 'e2e.forgotpw.' + Date.now() + '@gmail.com'}

# --- Register a throwaway Provider account (minimal setup) -------------
- tapOn: ".*რეგისტრაცია.*"
- tapOn: ".*ვასრულებ სამუშაოს.*"

- tapOn:
    id: "register-first-name"
- inputText: "ForgotPw"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.realEmail}"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn: "^გაგრძელება$"

- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true
- evalScript: ${output.otpEmail = output.realEmail}
- assertVisible: ".*დაადასტურე ელ. ფოსტა.*"
- runScript: ../scripts/fetch_otp.js
- inputText: "${output.otp}"

- extendedWaitUntil:
    visible: ".*შექმენი ოსტატის პროფილი.*"
    timeout: 20000
- tapOn: ".*აირჩიე სპეციალობა.*"
- tapOn: ".*სანტექნიკა.*"
- tapOn: "^არჩევა$"
- tapOn: ".*აირჩიე გამოცდილება.*"
- tapOn: "3–5 წელი"
- tapOn: ".*აირჩიე არეალი.*"
- assertVisible: ".*სამუშაო არეალი.*"
- tapOn: ".*ყველას მონიშვნა.*"
- tapOn: "^შენახვა$"
- tapOn:
    id: "setup-terms-checkbox"
    optional: true
- tapOn: "^პროფილის შექმნა$"
- assertVisible: ".*ახალი მოთხოვნები.*"

# --- Logout, back to Login -----------------------------------------------
- tapOn: "^პროფილი$"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*შესვლა.*"

# ============================ Email wizard =============================
- tapOn: ".*დაგავიწყდა პაროლი?.*"
- assertVisible: ".*პაროლი დაგავიწყდა?.*"

# --- Validation: an invalid email format keeps the submit button
# disabled (never even attempts a network call). ------------------------
- tapOn: "example@email.com"
- inputText: "notanemail"
- hideKeyboard
# The screen's own error text only renders on blur (`touched` state), and
# neither `hideKeyboard` nor tapping a plain, non-focusable Text elsewhere
# reliably fires RN's `onBlur` here — so assert the button's real
# `disabled` state instead (Button.tsx's `disabled` prop maps to
# Pressable's own `disabled`, which Android exposes as `enabled: false`
# in the accessibility tree).
- assertVisible:
    text: ".*კოდის გაგზავნა.*"
    enabled: false

# --- A well-formed but never-registered email must error (shouldCreateUser:
# false) and stay on step 1 — never silently create a blank account. ----
- eraseText
- inputText: "${output.staleEmail}"
- hideKeyboard
- tapOn: ".*კოდის გაგზავნა.*"
- assertVisible: ".*ვერ მოიძებნა.*"
- assertVisible: ".*პაროლი დაგავიწყდა?.*"

# --- A real, registered email must advance to step 2/3 (OTP entry). ----
- eraseText
- inputText: "${output.realEmail}"
- hideKeyboard
- tapOn: ".*კოდის გაგზავნა.*"
- assertVisible: ".*შეამოწმე ელ. ფოსტა.*"
- assertVisible: ".*${output.realEmail}.*"
# otp-code-input itself is the visually-hidden 1x1/opacity-0 TextInput
# (OtpCodeInput.tsx) — the 6 visible boxes above it and the keyboard
# already being open are the real proof it's focused/working; asserting
# on the hidden input's own testID fails (Maestro doesn't count it as
# "visible", even though it's functionally focused).
- assertVisible: ".*ხელახლა გაგზავნა.*წმ.*"

# --- Back returns to step 1 without submitting anything. ---------------
- tapOn:
    id: "recovery-back-button"
- assertVisible: ".*პაროლი დაგავიწყდა?.*"
- tapOn:
    id: "recovery-back-button"
- assertVisible: ".*შესვლა.*"

# ============================ Phone wizard ==============================
# Format-validation only — sending the actual SMS depends on the (paused)
# SMS provider, which is outside what this test should assert on.
- tapOn: "ტელეფონით გაგრძელება"
- tapOn: ".*დაგავიწყდა პაროლი?.*"
- assertVisible: ".*პაროლი დაგავიწყდა?.*"

# No hideKeyboard here — canSubmit isn't blur-gated (unlike the email
# screen's TextField), and a stray hideKeyboard with no keyboard actually
# open sends a bare BACK press that navigates off this screen entirely
# (confirmed live — it popped all the way back to PhoneLogin).
- tapOn: "5XX XX XX XX"
- inputText: "123"
- assertVisible:
    text: ".*კოდის გაგზავნა.*"
    enabled: false

- eraseText
- inputText: "555123456"
- assertVisible:
    text: ".*კოდის გაგზავნა.*"
    enabled: true

# recovery-back-button is top-of-screen, above the keyboard — no
# hideKeyboard needed (and, per the same risk noted above, safer to avoid).
- tapOn:
    id: "recovery-back-button"
- assertVisible: ".*შესვლა.*"
