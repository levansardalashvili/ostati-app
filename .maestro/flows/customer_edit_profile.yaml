appId: com.ostati.app
---
# CustomerEditProfileScreen — real Supabase persistence for name/address
# (`users` table, `userService.updateUserRecord`). `provider_core_journey.yaml`
# already covers the Provider-side equivalent; this was the last of the two
# Edit Profile screens with zero E2E coverage.
#
# Unlike ProviderEditProfileScreen (whose "first save always fails, second
# succeeds" demo quirk `provider_core_journey.yaml` has to work around),
# this screen's own doc-comment says that dance was removed as a leftover
# scaffold — `handleSave` does a real Supabase write on the very first tap,
# no double-attempt needed.

- launchApp
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run).
# It does NOT auto-dismiss; it must be tapped, or it sits there blocking
# everything underneath forever.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands on
# the dev-client's floating gear bubble instead — detect and back out of
# the Tools menu if it happened (see .maestro/README.md for the full
# root-cause writeup).
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 25000

# Leftover-session cleanup, in case a previous run crashed mid-flow.
- tapOn:
    text: ".*პროფილი.*"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

# --- Phase 1: Register a Customer -----------------------------------------
- evalScript: ${output.email = 'e2e.custedit.' + Date.now() + '@example.com'}
- tapOn: ".*დაწყება.*"
- tapOn: ".*მომხმარებელი.*"
- tapOn:
    id: "register-first-name"
- inputText: "EditCustomer"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.email}"
- tapOn: ".*ჭავჭავაძის.*"
- inputText: "Test address 1"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*პროფილის დასრულება.*"
- tapOn: "^დასრულება$"
- assertVisible: ".*სერვისები.*"

# --- Phase 2: Edit name + address, save, verify immediately --------------
- tapOn: ".*პროფილი.*"
- assertVisible: ".*EditCustomer E2E.*"
- tapOn: ".*პროფილის რედაქტირება.*"
- tapOn:
    id: "customer-edit-last-name"
- eraseText
- inputText: "Edited"
- hideKeyboard
# Tapping the field's own current TextInput value ("Test address 1", set
# at registration) rather than its separate, non-clickable label Text —
# `TextField.tsx` renders the label as a plain sibling `Text`, not part of
# the input's own tappable bounds.
- tapOn: ".*Test address 1.*"
- eraseText
- inputText: "Updated address 42"
- hideKeyboard
- tapOn: ".*ცვლილებების შენახვა.*"
- assertVisible: ".*EditCustomer Edited.*"
- assertVisible: ".*Updated address 42.*"

# --- Phase 3: Log out (clears all in-memory Context) and back in — the
# screen must load the REAL persisted name/address from Supabase. --------
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.email}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*პროფილი.*"
- assertVisible: ".*EditCustomer Edited.*"
- assertVisible: ".*Updated address 42.*"

# --- Cleanup: logout -------------------------------------------------------
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"
