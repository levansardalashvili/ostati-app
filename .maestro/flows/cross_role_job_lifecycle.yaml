appId: com.ostati.app
---
# Cross-role job lifecycle — Customer posts a job, a Provider expresses
# interest, Customer selects that Provider, both exchange a chat message,
# Provider marks the work done, Customer confirms + rates.
#
# Single continuous flow (not split into two files) because `output.*`
# variables (customer/provider emails, the unique job marker) only persist
# within one Maestro flow-file execution — the two accounts must be
# switched between (login/logout) several times within this one run.

- launchApp
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run,
# not just after `pm clear`/reinstall). It does NOT auto-dismiss; it must
# be tapped, or it sits there blocking everything underneath forever.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands
# on the dev-client's floating gear bubble instead (confirmed reproducible
# even on a factory-wiped emulator + fresh install — a raw `adb shell
# input tap` at the same coordinates never has this problem, only
# Maestro's own gesture-dispatch tap does), opening the Tools menu instead
# of dismissing the tip. Detect and back out of it if it happened.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 25000

- tapOn:
    text: ".*პროფილი.*"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

# --- Phase 1: Customer registers and posts a job -----------------------
- evalScript: ${output.customerEmail = 'e2e.cross.customer.' + Date.now() + '@example.com'}
- evalScript: ${output.providerEmail = 'e2e.cross.provider.' + Date.now() + '@example.com'}
- evalScript: ${output.jobMarker = 'CrossRoleE2E' + Date.now()}

- tapOn: ".*დაწყება.*"
- tapOn: ".*მომხმარებელი.*"
- tapOn:
    id: "register-first-name"
- inputText: "CrossCustomer"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.customerEmail}"
- tapOn: ".*ჭავჭავაძის.*"
- inputText: "Test address 1"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*პროფილის დასრულება.*"
- tapOn: "^დასრულება$"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- tapOn:
    point: "91%, 7%"
- assertVisible: ".*მოთხოვნის გამოქვეყნება.*"
- tapOn: ".*აირჩიე კატეგორია.*"
- tapOn: ".*სანტექნიკა.*"
- tapOn:
    id: "post-job-description"
- inputText: "${output.jobMarker} - kitchen faucet leak needs urgent repair, please help fix this soon"
- hideKeyboard
- tapOn: "^გამოქვეყნება$"
- assertVisible: ".*მოთხოვნა გამოქვეყნებულია.*"
- tapOn: ".*მთავარზე დაბრუნება.*"

- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 2: Provider registers, sets up, expresses interest ----------
- tapOn: ".*დაწყება.*"
- tapOn: ".*ოსტატი.*"
- tapOn:
    id: "register-first-name"
- inputText: "CrossProvider"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*შექმენი ოსტატის პროფილი.*"
- tapOn: ".*აირჩიე სპეციალობა.*"
- tapOn: ".*სანტექნიკოსი.*"
- tapOn: "^არჩევა$"
- tapOn: ".*აირჩიე არეალი.*"
- assertVisible: ".*სამუშაო არეალი.*"
- tapOn: ".*ყველას მონიშვნა.*"
- tapOn: "^შენახვა$"
- tapOn: "^პროფილის შექმნა$"
- assertVisible: ".*ახალი მოთხოვნები.*"

- tapOn:
    text: ".*დაინტ. ვარ.*"
    below: ".*${output.jobMarker}.*"
- tapOn: ".*ჩაწერეთ თანხა.*"
- inputText: "150"
- hideKeyboard
- tapOn:
    id: "offer-price-submit"
# Product change: interest confirmation now shows on ProviderJobDetailScreen's
# footer button ("შეთავაზდა: <price> ₾"), not the feed card's "sent" strip —
# see provider_core_journey.yaml for the full explanation. `back` pops the
# root-stack detail screen so the tab bar is reachable again.
- assertVisible: ".*შეთავაზდა:.*"
- back

- tapOn: ".*პროფილი.*"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 3: Customer logs back in, selects the Provider, sends a chat message
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- tapOn:
    text: ".*${output.jobMarker}.*"
- assertVisible: ".*დაინტერესებული.*"
- tapOn: "^არჩევა$"
- assertVisible: ".*ოსტატის არჩევა.*"
- tapOn: "^დადასტურება$"

- tapOn: ".*მიწერა.*"
- tapOn:
    id: "chat-message-input"
- inputText: "გამარჯობა, როდის შეგიძლიათ მოსვლა?"
# Dismiss the keyboard by tapping a blank coordinate (NOT `hideKeyboard`,
# which on Android falls back to a raw back-press when the keyboard has
# already auto-closed by this point — that back-press then escapes the
# screen entirely instead of just closing a keyboard that isn't there,
# eating one of the screen-navigation `back`s below). A coordinate tap
# on blank message-list background only blurs the input, never navigates.
- tapOn:
    point: "50%, 25%"
- tapOn:
    id: "chat-send-button"
- assertVisible: ".*გამარჯობა, როდის შეგიძლიათ მოსვლა.*"

- back
- back
- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 4: Provider logs back in, replies, marks work done ----------
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*ახალი მოთხოვნები.*"

- tapOn: ".*სამუშაოები.*"
- tapOn: "^დადასტურებული$"
- tapOn: ".*CrossCustomer.*"

- tapOn: ".*ჩატი.*"
- assertVisible: ".*გამარჯობა, როდის შეგიძლიათ მოსვლა.*"
- tapOn:
    id: "chat-message-input"
- inputText: "დიახ, ხვალ დილით შემიძლია."
- tapOn:
    point: "50%, 25%"
- tapOn:
    id: "chat-send-button"
- assertVisible: ".*დიახ, ხვალ დილით შემიძლია.*"
- back

- tapOn: "^სამუშაო დავასრულე$"
- assertVisible: ".*ელოდება მომხმარებლის დადასტურებას.*"

- back
- tapOn: ".*პროფილი.*"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 5: Customer logs back in, confirms completion, rates --------
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- tapOn: "^დადასტურებული$"
- tapOn:
    text: ".*${output.jobMarker}.*"

- assertVisible: ".*ოსტატმა სამუშაო დასრულებულად მონიშნა.*"
- tapOn: "^დადასტურება$"
- assertVisible: ".*ოსტატის შეფასება.*"
- tapOn: ".*ოსტატის შეფასება.*"

- assertVisible: ".*შეაფასე.*"
- tapOn:
    id: "rating-star-5"
- tapOn: ".*შეფასების გაგზავნა.*"
- assertVisible: ".*მადლობა შეფასებისთვის.*"
- tapOn: ".*მთავარზე დაბრუნება.*"

- assertVisible: ".*სერვისები.*"
- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 6: Provider logs back in and views its own now-completed job -
# `ProviderMyJobsScreen`'s card always navigates with `mode: 'selected'`
# (never 'completed' directly) — the screen itself resolves the real
# `variant` from the job's actual, freshly-fetched status (#82), so this
# still lands on the 'completed' variant (received-rating banner) because
# the job really is `status='completed'` in the DB by now. This is a
# freshly-registered Provider account with exactly one assigned job total
# (this same flow's job), so no jobMarker text-matching is needed on
# either list screen below — there's nothing else it could be.
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*ახალი მოთხოვნები.*"

- tapOn: ".*სამუშაოები.*"
- tapOn: "^დასრულებული$"
- tapOn:
    text: ".*სანტექნიკა.*"
    index: 0
- assertVisible: ".*სამუშაო დასრულებულად დადასტურდა.*"
- assertVisible: ".*5.0.*"
- back

# Also verify ProviderCompletedJobsScreen (Profile menu → "შესრულებული
# სამუშაოები" — a separate, non-tappable read-only list, #69) shows the
# same job with its real star rating (`reviewService.listReviewStarsByJob`).
- tapOn: ".*პროფილი.*"
- scrollUntilVisible:
    element: ".*შესრულებული სამუშაოები.*"
    direction: DOWN
    optional: true
- tapOn: ".*შესრულებული სამუშაოები.*"
- assertVisible: ".*სანტექნიკა.*"
- back

# Also verify ProviderReviewsScreen (Profile menu → "შეფასებები") shows
# the real, aggregated review — avg "5.0" and a "1 შეფ." count, both
# computed from the actual `reviews` row this same job just created
# (Phase 5's 5-star rating), not a hardcoded/mock summary.
- scrollUntilVisible:
    element: ".*შეფასებები.*"
    direction: DOWN
    optional: true
- tapOn: ".*შეფასებები.*"
- assertVisible: ".*5.0.*"
- assertVisible: ".*1 შეფ.*"
- back

# --- Cleanup: logout ------------------------------------------------------
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"
