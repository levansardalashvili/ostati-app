appId: com.ostati.app
---
# Notifications (#70) — a real server-side trigger event (Provider
# expresses interest → `handle_job_response_notify()` inserts a
# notification row for the Customer, supabase/migrations/0021) shows up
# on NotificationsScreen, tapping it navigates to CustomerJobDetail AND
# marks it read (`notificationService.markRead`), and the unread
# indicator ("ყველა წაკითხ.", only rendered when unreadCount > 0)
# disappears afterward.

- launchApp
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run,
# not just after `pm clear`/reinstall). It does NOT auto-dismiss; it must
# be tapped, or it sits there blocking everything underneath forever.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands
# on the dev-client's floating gear bubble instead (confirmed reproducible
# even on a factory-wiped emulator + fresh install — a raw `adb shell
# input tap` at the same coordinates never has this problem, only
# Maestro's own gesture-dispatch tap does), opening the Tools menu instead
# of dismissing the tip. Detect and back out of it if it happened.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 25000

- tapOn:
    text: ".*პროფილი.*"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

# --- Phase 1: Customer registers, posts a job ---------------------------
- evalScript: ${output.customerEmail = 'e2e.notif.customer.' + Date.now() + '@example.com'}
- evalScript: ${output.providerEmail = 'e2e.notif.provider.' + Date.now() + '@example.com'}
- evalScript: ${output.jobMarker = 'NotifJobE2E' + Date.now()}

- tapOn: ".*დაწყება.*"
- tapOn: ".*მომხმარებელი.*"
- tapOn:
    id: "register-first-name"
- inputText: "NotifCustomer"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.customerEmail}"
- tapOn: ".*ჭავჭავაძის.*"
- inputText: "Test address 1"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*პროფილის დასრულება.*"
- tapOn: "^დასრულება$"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- tapOn:
    point: "91%, 7%"
- tapOn: ".*აირჩიე კატეგორია.*"
- tapOn: ".*სანტექნიკა.*"
- tapOn:
    id: "post-job-description"
- inputText: "${output.jobMarker} - kitchen sink dripping constantly, needs a plumber"
- hideKeyboard
- tapOn: "^გამოქვეყნება$"
- assertVisible: ".*მოთხოვნა გამოქვეყნებულია.*"
- tapOn: ".*მთავარზე დაბრუნება.*"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 2: Provider registers, expresses interest (fires the notify trigger)
- tapOn: ".*დაწყება.*"
- tapOn: ".*ოსტატი.*"
- tapOn:
    id: "register-first-name"
- inputText: "NotifProvider"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*შექმენი ოსტატის პროფილი.*"
- tapOn: ".*აირჩიე სპეციალობა.*"
- tapOn: ".*სანტექნიკოსი.*"
- tapOn: "^არჩევა$"
- tapOn: ".*აირჩიე არეალი.*"
- assertVisible: ".*სამუშაო არეალი.*"
- tapOn: ".*ყველას მონიშვნა.*"
- tapOn: "^შენახვა$"
- tapOn: "^პროფილის შექმნა$"
- assertVisible: ".*ახალი მოთხოვნები.*"
- extendedWaitUntil:
    visible: ".*${output.jobMarker}.*"
    timeout: 15000

- tapOn:
    text: ".*დაინტ. ვარ.*"
    below: ".*${output.jobMarker}.*"
- tapOn: ".*ჩაწერეთ თანხა.*"
- inputText: "110"
- hideKeyboard
- tapOn:
    id: "offer-price-submit"
# Product change: interest confirmation now shows on ProviderJobDetailScreen's
# footer button ("შეთავაზდა: <price> ₾"), not the feed card's "sent" strip —
# see provider_core_journey.yaml for the full explanation. `back` pops the
# root-stack detail screen so the tab bar is reachable again.
- assertVisible: ".*შეთავაზდა:.*"
- back

- tapOn: ".*პროფილი.*"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 3: Customer logs back in, checks the notification -----------
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

# Same fab/bubble collision as "post-job-fab" — this icon-only bell sits
# in the same top-right corner. Tap its top edge instead (same point that
# reliably works for "post-job-fab"/"job-detail-menu-button" — 6% missed
# the bell's clickable bounds by a few px, landing on nothing at all).
- tapOn:
    point: "91%, 7%"
- assertVisible: ".*ახალი ოსტატი დაინტერესდა.*"
- assertVisible: ".*ყველა წაკითხ.*"

- tapOn: ".*ახალი ოსტატი დაინტერესდა.*"
- assertVisible: ".*დაინტერესებული.*"

- back
- assertVisible: ".*ახალი ოსტატი დაინტერესდა.*"
- assertNotVisible: ".*ყველა წაკითხ.*"

- back
- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"
