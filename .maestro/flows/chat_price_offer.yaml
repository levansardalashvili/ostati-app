appId: com.ostati.app
---
# D3 — chat-ის სტრუქტურირებული ფასის შეთავაზება. Provider ხსნის ჩატს job
# ჯერ კიდევ 'pending'-ზე (job_responses-ით უკვე დაინტერესებული, არჩეული
# ჯერ არავინაა), აგზავნის ფასის offer-ს (Wallet ღილაკი), Customer
# ეთანხმება პირდაპირ offer-ბარათიდან. ცალკე flow-ია cross_role_job_
# lifecycle.yaml-იდან — იქ ჩატი ხდება მხოლოდ Provider-ის არჩევის
# ("select_provider") შემდეგ, აქ კი პირიქით — არჩევამდე, სანამ job
# ჯერ კიდევ ღიაა.

- launchApp
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run,
# not just after `pm clear`/reinstall). It does NOT auto-dismiss; it must
# be tapped, or it sits there blocking everything underneath forever.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands
# on the dev-client's floating gear bubble instead (confirmed reproducible
# even on a factory-wiped emulator + fresh install — a raw `adb shell
# input tap` at the same coordinates never has this problem, only
# Maestro's own gesture-dispatch tap does), opening the Tools menu instead
# of dismissing the tip. Detect and back out of it if it happened.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 25000

- tapOn:
    text: ".*პროფილი.*"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

# --- Phase 1: Customer registers and posts a job -----------------------
- evalScript: ${output.customerEmail = 'e2e.offer.customer.' + Date.now() + '@example.com'}
- evalScript: ${output.providerEmail = 'e2e.offer.provider.' + Date.now() + '@example.com'}
- evalScript: ${output.jobMarker = 'ChatOfferE2E' + Date.now()}

- tapOn: ".*დაწყება.*"
- tapOn: ".*მომხმარებელი.*"
- tapOn:
    id: "register-first-name"
- inputText: "OfferCustomer"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.customerEmail}"
- tapOn: ".*ჭავჭავაძის.*"
- inputText: "Test address 1"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*პროფილის დასრულება.*"
- tapOn: "^დასრულება$"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- tapOn:
    point: "91%, 7%"
- assertVisible: ".*მოთხოვნის გამოქვეყნება.*"
- tapOn: ".*აირჩიე კატეგორია.*"
- tapOn: ".*ელექტროობა.*"
- tapOn:
    id: "post-job-description"
- inputText: "${output.jobMarker} - bathroom outlet sparking, needs an electrician urgently please"
- hideKeyboard
- tapOn: "^გამოქვეყნება$"
- assertVisible: ".*მოთხოვნა გამოქვეყნებულია.*"
- tapOn: ".*მთავარზე დაბრუნება.*"

- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 2: Provider registers, expresses interest, sends a chat offer
- tapOn: ".*დაწყება.*"
- tapOn: ".*ოსტატი.*"
- tapOn:
    id: "register-first-name"
- inputText: "OfferProvider"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*შექმენი ოსტატის პროფილი.*"
- tapOn: ".*აირჩიე სპეციალობა.*"
- tapOn: ".*ელექტრიკოსი.*"
- tapOn: "^არჩევა$"
- tapOn: ".*აირჩიე არეალი.*"
- assertVisible: ".*სამუშაო არეალი.*"
- tapOn: ".*ყველას მონიშვნა.*"
- tapOn: "^შენახვა$"
- tapOn: "^პროფილის შექმნა$"
- assertVisible: ".*ახალი მოთხოვნები.*"

- tapOn:
    text: ".*დაინტ. ვარ.*"
    below: ".*${output.jobMarker}.*"
- tapOn: ".*ჩაწერეთ თანხა.*"
- inputText: "100"
- hideKeyboard
- tapOn:
    id: "offer-price-submit"
- assertVisible: ".*ინტერესი გაგზავნილია.*"

- tapOn:
    text: ".*ჩატის გახსნა.*"
    below: ".*${output.jobMarker}.*"
- tapOn:
    id: "chat-offer-open"
- assertVisible: ".*ფასის შეთავაზება.*"
- tapOn: ".*ჩაწერეთ თანხა.*"
- inputText: "180"
# The number-pad keyboard here is tall enough to cover the entire sheet
# (title included), so there's no safe non-input element left to tap —
# unlike the chat composer's text keyboard. `hideKeyboard` is reliable for
# this numeric-keypad case (same as the OfferPriceSheet step in Phase 2
# above, proven across many runs) — the earlier chat-composer flakiness
# was specific to that multiline text field's IME, not this one.
- hideKeyboard
- tapOn: "^გაგზავნა$"
- assertVisible: ".*180 ₾.*"

# Chat was opened directly from the ProviderHomeScreen tab (not from a
# root-stack job-detail screen), so a single `back` already lands on the
# tab bar — unlike the CustomerJobDetail→Chat hop in Phase 3 below, which
# needs two.
- back
- tapOn: ".*პროფილი.*"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 3: Customer logs back in, sees the offer, accepts it --------
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- tapOn:
    text: ".*${output.jobMarker}.*"
- assertVisible: ".*დაინტერესებული.*"
- tapOn: ".*მიწერა.*"
- assertVisible: ".*180 ₾.*"
- tapOn: "^დათანხმება$"
- assertVisible: ".*ფასი შეთანხმებულია.*"

- back
- back
- tapOn: ".*პროფილი.*"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"
