appId: com.ostati.app
---
# Provider verification request (Task 3, #87) — `VerificationRequestCard`
# on ProviderProfileScreen. Covers the ELIGIBILITY-GATING path only: a
# freshly-registered Provider has completed specialty + work area (both
# mandatory during ProviderSetupScreen) but never uploaded a profile
# photo, so `getVerificationEligibility()` should correctly report
# "პროფილის ფოტო" as the one missing requirement and keep the request
# button disabled. The actual submit path (`request_provider_verification`
# RPC) requires a profile photo first, which needs the native OS camera/
# gallery picker — left out of E2E scope for the same reason Google
# Sign-In is (native-picker automation is unreliable), see README.

- launchApp
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run,
# not just after `pm clear`/reinstall). It does NOT auto-dismiss; it must
# be tapped, or it sits there blocking everything underneath forever.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands
# on the dev-client's floating gear bubble instead (confirmed reproducible
# even on a factory-wiped emulator + fresh install — a raw `adb shell
# input tap` at the same coordinates never has this problem, only
# Maestro's own gesture-dispatch tap does), opening the Tools menu instead
# of dismissing the tip. Detect and back out of it if it happened.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 25000

- tapOn:
    text: ".*პროფილი.*"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

# --- Provider registers, completes setup (no photo) ---------------------
- evalScript: ${output.providerEmail = 'e2e.verify.provider.' + Date.now() + '@example.com'}

- tapOn: ".*დაწყება.*"
- tapOn: ".*ოსტატი.*"
- tapOn:
    id: "register-first-name"
- inputText: "VerifyProvider"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-terms-checkbox"
- tapOn: ".*რეგისტრაცია.*"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*შექმენი ოსტატის პროფილი.*"
- tapOn: ".*აირჩიე სპეციალობა.*"
- tapOn: ".*სანტექნიკოსი.*"
- tapOn: "^არჩევა$"
- tapOn: ".*აირჩიე არეალი.*"
- assertVisible: ".*სამუშაო არეალი.*"
- tapOn: ".*ყველას მონიშვნა.*"
- tapOn: "^შენახვა$"
- tapOn: "^პროფილის შექმნა$"
- assertVisible: ".*ახალი მოთხოვნები.*"

# --- Verification card should show, gated on the missing profile photo -
- tapOn: ".*პროფილი.*"
- scrollUntilVisible:
    element: ".*გახდი ვერიფიცირებული ოსტატი.*"
    direction: DOWN
- assertVisible: ".*დაასრულე პროფილი მოთხოვნამდე.*"
- assertVisible: ".*პროფილის ფოტო.*"

# Tapping the disabled request button must not open the confirm sheet.
- tapOn:
    text: "^ვერიფიკაციის მოთხოვნა$"
    optional: true
- assertNotVisible: ".*შენი პროფილი გადაეცემა განხილვას.*"

- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"
