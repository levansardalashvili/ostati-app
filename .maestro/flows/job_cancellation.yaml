appId: com.ostati.app
---
# Job cancellation — covers both RPC paths: (A) Customer cancels a still-
# 'pending' job directly, no reason required (`cancel_job`); (B) Provider
# cancels an already-'active' (selected) job with a mandatory fixed reason
# code (`provider_cancel_job`, supabase/migrations/0036) — a code path
# that had no E2E coverage at all before this flow.

- launchApp:
    stopApp: false
- extendedWaitUntil:
    notVisible: "Loading from"
    timeout: 20000
# Optional dev-client "developer menu" onboarding tip — shown once per
# fresh PROCESS START (an in-memory flag, not persisted — `launchApp`
# restarts the process each time, so this reappears on every single run,
# not just after `pm clear`/reinstall). It does NOT auto-dismiss; it must
# be tapped, or it sits there blocking everything underneath forever.
- extendedWaitUntil:
    visible: "DEVELOPMENT SERVERS|Continue|.*დაწყება.*|.*პროფილი.*"
    timeout: 30000
    optional: true
- tapOn:
    point: "37%,28%"
    optional: true
- extendedWaitUntil:
    visible: "Loading from|Continue|.*დაწყება.*|.*პროფილი.*"
    timeout: 90000
    optional: true
- extendedWaitUntil:
    visible: "Continue"
    timeout: 6000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Maestro's accessibility-injected tap on "Continue" consistently lands
# on the dev-client's floating gear bubble instead (confirmed reproducible
# even on a factory-wiped emulator + fresh install — a raw `adb shell
# input tap` at the same coordinates never has this problem, only
# Maestro's own gesture-dispatch tap does), opening the Tools menu instead
# of dismissing the tip. Detect and back out of it if it happened.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - back
- extendedWaitUntil:
    visible: ".*(პროფილი|დაწყება).*"
    timeout: 90000

- tapOn:
    text: "^პროფილი$"
    optional: true
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
    optional: true
- tapOn:
    text: ".*გასვლა.*"
    optional: true
- tapOn:
    id: "logout-confirm-button"
    optional: true

# --- Phase 1: Customer registers, posts Job A, cancels it (pending) ----
- evalScript: ${output.customerEmail = 'e2e.cancel.customer.' + Date.now() + '@example.com'}
- evalScript: ${output.providerEmail = 'verified.provider@e2e.example.com'}
- evalScript: ${output.jobAMarker = 'CancelJobA' + Date.now()}
- evalScript: ${output.jobBMarker = 'CancelJobB' + Date.now()}

- tapOn: ".*დაწყება.*"
- tapOn: ".*მომხმარებელი.*"
- tapOn:
    id: "register-first-name"
- inputText: "CancelCustomer"
- tapOn:
    id: "register-last-name"
- inputText: "E2E"
- tapOn:
    id: "register-email"
- inputText: "${output.customerEmail}"
- tapOn: ".*ჭავჭავაძის.*"
- inputText: "Test address 1"
- hideKeyboard
- tapOn:
    id: "register-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn: "^გაგრძელება$"
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "Never"
    optional: true

- assertVisible: ".*პროფილის დასრულება.*"
- tapOn:
    id: "setup-terms-checkbox"
    optional: true
- tapOn: "^დასრულება$"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- tapOn:
    point: "91%, 7%"
- tapOn: ".*აირჩიეთ კატეგორია.*"
- tapOn: ".*სანტექნიკა.*"
- tapOn:
    id: "post-job-description"
- inputText: "${output.jobAMarker} - leaking pipe under the kitchen sink needs a quick fix"
- hideKeyboard
- tapOn: "^გამოქვეყნება$"
- assertVisible: ".*მოთხოვნა გამოქვეყნებულია.*"
- tapOn: ".*მთავარზე დაბრუნება.*"
# "მთავარზე დაბრუნება" does a hard navigation.reset() to Home. Home's own
# content being visible isn't enough — the tab bar itself can still be
# mid-transition and not yet responsive to taps (confirmed: a `tapOn` on
# a tab bar item right after this assertVisible silently landed nowhere,
# staying on Home, in an earlier run) — `waitForAnimationToEnd` settles
# the actual transition, not just content visibility.
- assertVisible: ".*სერვისები.*"
- waitForAnimationToEnd

- tapOn: ".*განცხადებები.*"
# This tab refetches on every focus (useFocusEffect) — the skeleton can
# still be showing when a plain `tapOn` would otherwise time out.
- extendedWaitUntil:
    visible: ".*${output.jobAMarker}.*"
    timeout: 15000
- tapOn:
    text: ".*${output.jobAMarker}.*"
# Same fab/bubble collision as "post-job-fab" — this icon-only "..."
# button sits in the same top-right corner. Tap its top edge instead.
- tapOn:
    point: "92%, 7%"
- tapOn: "^გაუქმება$"
- assertVisible: ".*მოთხოვნის გაუქმება.*"
- tapOn: "^გაუქმება$"
- assertVisible: ".*გაუქმდა.*"

# --- Phase 2: Customer posts Job B (for the Provider-cancel path) ------
# Job detail was opened directly from the MyJobsTab (no chat hop in
# between, unlike other flows), so one `back` already lands on the tab.
- back
- tapOn:
    point: "91%, 7%"
- tapOn: ".*აირჩიეთ კატეგორია.*"
- tapOn: ".*ელექტროობა.*"
- tapOn:
    id: "post-job-description"
- inputText: "${output.jobBMarker} - kitchen light switch not working, needs an electrician"
- hideKeyboard
- tapOn: "^გამოქვეყნება$"
- assertVisible: ".*მოთხოვნა გამოქვეყნებულია.*"
- tapOn: ".*მთავარზე დაბრუნება.*"
# "მთავარზე დაბრუნება" does a hard navigation.reset() to Home. Home's own
# content being visible isn't enough — the tab bar itself can still be
# mid-transition and not yet responsive to taps (confirmed: a `tapOn` on
# a tab bar item right after this assertVisible silently landed nowhere,
# staying on Home, in an earlier run) — `waitForAnimationToEnd` settles
# the actual transition, not just content visibility.
- assertVisible: ".*სერვისები.*"
- waitForAnimationToEnd

- tapOn: "^პროფილი$"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 3: Provider registers, expresses interest on Job B ----------
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*ახალი მოთხოვნები.*"
- extendedWaitUntil:
    visible: ".*${output.jobBMarker}.*"
    timeout: 15000

- tapOn:
    text: ".*დეტალების ნახვა.*"
    below: ".*${output.jobBMarker}.*"
- tapOn: ".*ფასის შეთავაზება.*"
- tapOn: ".*ჩაწერეთ თანხა.*"
- inputText: "120"
- hideKeyboard
- tapOn:
    id: "offer-price-submit"
# Product change: interest confirmation now shows on ProviderJobDetailScreen's
# footer button ("შეთავაზდა: <price> ₾"), not the feed card's "sent" strip —
# see provider_core_journey.yaml for the full explanation. `back` pops the
# root-stack detail screen so the tab bar is reachable again.
- assertVisible: ".*შეთავაზდა:.*"
- back

- tapOn: "^პროფილი$"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 4: Customer logs back in, selects the Provider for Job B ----
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- extendedWaitUntil:
    visible: ".*${output.jobBMarker}.*"
    timeout: 15000
- tapOn:
    text: ".*${output.jobBMarker}.*"
- assertVisible: ".*დაინტერესებული.*"
- tapOn: "^არჩევა$"
- assertVisible: ".*ოსტატის არჩევა.*"
- tapOn: "^დადასტურება$"

- back
- tapOn: "^პროფილი$"
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 5: Provider logs back in, cancels the now-active Job B ------
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.providerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*ახალი მოთხოვნები.*"

- tapOn: ".*სამუშაოები.*"
- tapOn: "^დადასტურებული$"
- extendedWaitUntil:
    visible: ".*CancelCustomer.*"
    timeout: 15000
- tapOn: ".*CancelCustomer.*"

# Same fab/bubble collision as "post-job-fab" — this icon-only "..."
# button sits in the same top-right corner. Tap its top edge instead.
- tapOn:
    point: "92%, 7%"
- tapOn:
    id: "provider-cancel-menu-row"
- assertVisible: ".*მომხმარებელს ეცნობება გაუქმების შესახებ.*"
- tapOn: ".*დროის კონფლიქტი.*"
- tapOn:
    id: "provider-cancel-submit"
- assertVisible: ".*შენ გააუქმე ეს სამუშაო.*"

- back
- tapOn: "^პროფილი$"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"

# --- Phase 6: Customer sees the Provider-cancelled Job B and reopens it (0097) ---
# Cancelled jobs live in the "დასრულებული" tab. The Provider who cancelled is excluded, so after
# reopening the job is pending again with no interested providers left.
- tapOn: ".*შესვლა.*"
- tapOn:
    id: "login-email"
- inputText: "${output.customerEmail}"
- hideKeyboard
- tapOn:
    id: "login-password"
- inputText: "TestPass123"
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- assertVisible: ".*სერვისები.*"

- tapOn: ".*განცხადებები.*"
- tapOn: "^დასრულებული$"
- extendedWaitUntil:
    visible: ".*${output.jobBMarker}.*"
    timeout: 15000
- tapOn:
    text: ".*${output.jobBMarker}.*"
- assertVisible: ".*ოსტატმა სამუშაო გააუქმა.*"
- tapOn:
    id: "reopen-job-button"
- extendedWaitUntil:
    visible: ".*დაინტერესებული ოსტატი არ არის.*"
    timeout: 15000
- assertNotVisible: ".*ოსტატმა სამუშაო გააუქმა.*"

- back
- tapOn: "^პროფილი$"
- scrollUntilVisible:
    element: ".*გასვლა.*"
    direction: DOWN
- tapOn: ".*გასვლა.*"
- tapOn:
    id: "logout-confirm-button"
- assertVisible: ".*დაწყება.*"
